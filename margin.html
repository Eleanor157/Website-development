<!DOCTYPE html>
<html>
    <head>
        <title>Margins in CSS</title>
        <style>
            .box1{
            background:lightgreen;
            height:200px;
            width:200px;
            }
            .box2{
                background:lightskyblue;
                height:200px;
                width:200px;
                padding-left:30px;
                margin-top:50px;
                float:right;
            }
        </style>
    </head>

    <body>
        <div class="box1">
            I am box1
        </div>
            <div class="box2">
            I am box2
        </div>
    </body>
</html>
