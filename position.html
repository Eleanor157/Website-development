<!DOCTYPE html>
<html>
    <head>
        <title>Position in CSS</title>
        <style>
       .box-static{
        background-color:blue;
        font-size:50px;
        width:300px;
        height:300px;
        position:static;
        bottom:30px;
       }
       .box-fixed{
        background-color:lavenderblush;
        font-size:40px;
        width:400px;
        height:400px;
        position:fixed;
        right:30px;
        top:5px;
       }
         .box-relative{
        background-color:aquamarine;
        font-size:30px;
        width:800px;
        height:800px;
        position:relative;
        right:30px;
        top:5px;
       }
         .box-absolute{
        background-color:purple;
        font-size:30px;
        width:300px;
        height:300px;
        position:absolute;
        top:500px;
       }
          .box-sticky{
        background-color:hotpink;
        font-size:30px;
        width:300px;
        height:300px;
        position:sticky;
        top:500px;
       }
        </style>
    </head>
    <body>
        <div class="box-static">
            I am static Position
        </div>
        <div class="box-fixed">
            I am fixed position
        </div>
        <div class="box-relative">
            I am relative position
        </div>
        <div class="box-absolute">
            I am absolute position
        </div>
        <div class="box-sticky">
            I am sticky position
        </div>
    </body>
</html>
