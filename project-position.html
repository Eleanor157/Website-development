<!DOCTYPE html>
<html>
<head>
<title>Position</title>
<style>
.box-static{
background-color:aqua;
font-size:50px;
position:static;
height:300px;
width:300px;
}
.box-fixed{
background-color:hotpink;
font-size:40px;
position:fixed;
width:400px;
height:400px;
right:20px;
top:4px;
}
.box-relative{
background-color:lightgreen;
font-size:30px;
position:relative;
width:300px;
height:300px;
top:6px;
right:25px;
}
.box-sticky{
background-color:lightblue;
font-size:60px;
position:sticky;
width:400px;
height:400px;
right:19px;
top:29px;
}
.box-absolute{
background-color:yellow;
font-size:65px;
position:absolute;
width:350px;
height:350px;
right:22px;
top:30px;
}
</style>
</head>
<body>
<div class="box-static">
This is static position
</div>
<div class="box-fixed">
This is fixed position
</div>
<div class="box-relative">
This is a relative position
</div>
<div class="box-sticky">
This is a sticky position
</div>
<div class="box-absolute">
This is a absolute position
</div>
</body>
</html>
